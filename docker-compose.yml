services:
  # Postgres 17 + pgvector (vector search for RAG).
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackathon
    ports:
      - "4102:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches every email the API sends. Inbox: http://localhost:4104
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "4103:1025"
      - "4104:8025"

volumes:
  pgdata:
